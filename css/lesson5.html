<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css properties</title>
</head>
<style>
    .text1{
        background-color: darkblue;
        font-size: 50px; 
        /* margin:2rem ;
        padding:2rem; */
    }
    .text2{
        text-shadow: 50px 30px 3px black;
        margin-bottom: 100px;
        text-align: center;
        text-transform: lowercase; 
        /* uppercase, capitilize */
        font-variant: small-caps;

        font-weight: bold;

        font-style: italic;

        text-decoration: line-through;

    

        
    }
    .image{ 
        width: 200px;

        height: 200px;

        border: 30px dashed red;
        /* width style color  */

        border-radius: 9999px;
        /* 50% */

        transition: 1s;


    }
    .image:hover{
        transform:scale(1.5);

    }
</style>
<body>
    <!-- css selector {property : value;} 
     -->
    <p class="text1"> BARRY ALLEN</p>
    <p class="text2">Flash</p>
    <img src="../Image/angela.jpg " class="image">
</body>
</html>
