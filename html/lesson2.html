<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lesson 2</title>
</head>

<body>

    <h3> This is unordered list</h3>
    <ul>
        <li>apple</li>
        <li>apple</li>
        <li>apple</li>
        <li>apple</li>
        <li>apple</li>

    </ul>
    <h3>This is order list</h3>
    <!-- A, a, I , i -->
    <ol type="i">
        <li>apple</li>
        <li>apple</li>
        <li>apple</li>
        <li>apple</li>
        <li>apple</li>
    </ol>

    <h3>this is nested list </h3>
    <ol type="I">
        <li>this is drink
            <ol>
                <li>Coffee</li>
                <li>Tea</li>
                <li>Juice</li>
            </ol>
        </li>


        <li> This is food <ol>


                <li>Rice</li>
                <li>Noodle</li>
                <li>Soup</li>
            </ol>
        </li>
    </ol>


</body>

</html>
