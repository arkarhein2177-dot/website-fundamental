<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lesson4</title>
</head>

<body>
    <p align="center"> this is Table</p>

    <table border="5" align="center">
        <tr>
            <th>No</th>
            <th>Name</th>
            <th>Price</th>
            <th>Total</th>
        </tr>
        <tr>
            <td>1</td>
            <td>apple</td>
            <td>100</td>
            <td>4</td>
        </tr>
        <tr>
            <td>2</td>
            <td>orange</td>
            <td>200</td>
            <td>4</td>
        </tr>
        <tr>
            <td>3</td>
            <td>Grape</td>
            <td>300</td>
            <td>6</td>
        </tr>
        <tr>
            <td>4</td>
            <td>mango</td>
            <td>300</td>
            <td>3</td>
        </tr>
    </table>
    <h3 align="center">This is spanning columns</h3>
    <table align="center" border="5">
        <tr>
            <th>Monday</th>
            <th>Tuesday</th>
            <th>Wednesday</th>
            
        </tr>
        <tr>
            <td colspan="2">Out of town</td>
            <td>Back to town</td>
        </tr>
    </table>
 <h3 align="center">Spanning Rows</h3>
    <table align="center" border="5">
        <tr>
            <th></th>
            <th>Saturday</th>
            <th>Sunday</th>
        </tr>
        <tr>
            <td>Monday</td>
            <td rowspan="2">Work</td>
            <td rowspan="3">Relax</td>
        </tr>
        <tr>
            <td>Afternoon</td>
        </tr>
        <td>Evenig</td>
        <td>Dinner</td>
    </table>
</body>

</html>
