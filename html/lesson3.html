<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lesson 3</title>
</head>

<body>
    <h3 align="center"> this is form </h3>
    <!-- readonly -->
    <form align="center">
        NAME<input type="text" placeholder="enter your name"><br>
        NUMBER<input type="number" placeholder="001" value="1000"><br>
        PASSWORD<input type="password" placeholder="OOOO"><br>
        EMAIL<input type="email@gmail.com" placeholder="@gmail.com" required> <br>
        DATE<input type="date"><br>
        DATETIME<input type="datetime-local"><br>
        <!-- disabled -->
        SEARCHBAR <input type="search"><br>
        RANGE<input type="range"><br>
        FILE<input type="file"><br>
        COLOR<input type="color"><br>
        CHECKBOX<input type="checkbox" checked><br>
        RADIO
        <input type="radio">Male
        <input type="radio">Female
        <input type="radio" checked>prefer not to say<br>

        SELECT 
        <select>
            <option>A</option>
            <option>B</option>
            <option selected>C</option>
        </select><br>

         MESSAGE
         <textarea maxlength="100" minlength="0"></textarea><br>

         <input type="submit" value="Login"><br>

         <input type="reset" value="Clear"><br>



    </form>

</body>

</html>
